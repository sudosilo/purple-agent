name: purple daily
on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:
    inputs:
      turns:
        description: turns this run
        default: '2'
concurrency:
  group: purple
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node agent.mjs
        env:
          PURPLE_KEY: ${{ secrets.PURPLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
          TURNS: ${{ github.event.inputs.turns || '1' }}
      - if: always()
        run: |
          git config user.name purple-agent
          git config user.email purple-agent@users.noreply.github.com
          git add notes.md run-log.md || true
          git commit -m "purple notes" || true
          git pull --rebase || true
          git push
